services:

  kafka:
    profiles: [local]
    image: bitnami/kafka:3.9
    ports:
      - "9092:9092"   # internal (app)
      - "9094:9094"   # external (host/tooling)
    environment:
      # KRaft mode — no ZooKeeper needed
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD", "kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dotohtwolocalinfra

  redis:
    profiles: [local]
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dotohtwolocalinfra

  cassandra:
    profiles: [local]
    image: cassandra:5
    ports:
      - "9042:9042"
    environment:
      CASSANDRA_CLUSTER_NAME: dotohtwo
    healthcheck:
      test: ["CMD", "cqlsh", "-e", "describe keyspaces"]
      interval: 15s
      timeout: 10s
      retries: 10
    networks:
      - dotohtwolocalinfra

  review-processor:
    build:
      context: .
      args:
        CODEARTIFACT_AUTH_TOKEN: ${CODEARTIFACT_AUTH_TOKEN}
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_CASSANDRA_CONTACT_POINTS: cassandra
      FOLLOWER_SERVICE_BASE_URL: http://user-reviewable-api:8080
    networks:
      - dotohtwolocalinfra

networks:
  dotohtwolocalinfra:
    name: dotohtwolocalinfra

volumes:
  redis-data:
