spring.application.name=review-processor
server.port=8082

# Kafka Consumer Configuration
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=review-processor-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.value.default.type=com.dotohtwo.models.dto.ReviewCreatedEvent
spring.kafka.consumer.properties.spring.json.trusted.packages=com.dotohtwo.models.dto


# Topic names
kafka.topic.reviews=reviews
kafka.topic.users-followed=users.followed

# How far back to backfill a new follower's timeline (days)
timeline.follow-backfill-days=30

# Redis Configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Follower service
follower-service.base-url=http://localhost:8080
